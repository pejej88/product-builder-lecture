<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추천</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <span>로또 번호 추천기</span>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 다크 모드</button>
</header>

<div id="container">
    <button id="btn" onclick="generateLotto()">5세트 추천 받기</button>
    <div id="result"></div>
</div>

<div id="contact-section">
    <h3>제휴 및 서비스 문의</h3>
    <form action="https://formspree.io/f/xdawzqob" method="POST" id="contact-form">
        <input type="email" name="email" placeholder="이메일 주소를 입력하세요" required>
        <textarea name="message" placeholder="문의 내용을 입력하세요" required></textarea>
        <button type="submit">문의하기</button>
    </form>
</div>

<script src="main.js"></script>
</body>
</html>
