<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인공지능 동물상 테스트</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>

<header>
    <span>인공지능 동물상 테스트</span>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 다크 모드</button>
</header>

<div id="container">
    <div id="upload-area">
        <input type="file" id="image-upload" accept="image/*" onchange="previewImage(event)" hidden>
        <button id="upload-btn" onclick="document.getElementById('image-upload').click()">사진 업로드</button>
        <div id="image-preview-container">
            <img id="image-preview" src="#" alt="이미지 미리보기" style="display:none; max-width: 100%; border-radius: 12px; margin-top: 20px;">
        </div>
    </div>
    
    <button id="predict-btn" onclick="predict()" style="display:none; margin-top: 20px;">결과 확인하기</button>
    
    <div id="loading" style="display:none; margin-top: 20px;">
        모델을 로딩 중입니다...
    </div>

    <div id="result-container" style="margin-top: 30px;">
        <div id="label-container"></div>
    </div>
</div>

<div id="contact-section">
    <h3>제휴 및 서비스 문의</h3>
    <form action="https://formspree.io/f/xdawzqob" method="POST" id="contact-form">
        <input type="email" name="email" placeholder="이메일 주소를 입력하세요" required>
        <textarea name="message" placeholder="문의 내용을 입력하세요" required></textarea>
        <button type="submit">문의하기</button>
    </form>
</div>

<div id="disqus_thread"></div>
<script>
    (function() { // DON'T EDIT BELOW THIS LINE
    var d = document, s = d.createElement('script');
    s.src = 'https://productbuilder-iaj6fbupjm.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
    })();
</script>
<noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>

<script src="main.js"></script>
</body>
</html>
